{% extends 'events/management/full_width_base.html' %}
{% from 'events/timetable/_timetable.html' import render_timetable %}

{%- block banner -%}{%- endblock -%}
{%- block title -%}{%- endblock -%}

{% block content %}
    <button class="timetable-sidepanel-management-toggle icon-prev i-button"
            title="{% trans %}Toggle menu{% endtrans %}"
            data-qtip-position="right">
    </button>
    <div id="timetable-container"
         data-timetable-data="{{ timetable_data | tojson | forceescape }}"
         data-event-info="{{ event_info | tojson | forceescape }}"
         data-custom-links="{{ custom_links | tojson | forceescape }}"
         data-search-token="{{ make_user_search_token() }}"
         data-sentry-dsn="{{ indico_config.SENTRY_DSN }}">
    </div>
    <script>
        setupTimetable();

        document.querySelector('.timetable-sidepanel-management-toggle').addEventListener('click', evt => {
            const sidePanelToggleButton = evt.target;
            const main = document.querySelector('main.main');
            sidePanelToggleButton.classList.toggle('icon-prev');
            sidePanelToggleButton.classList.toggle('icon-next');
            main.classList.toggle('side-panel-closed');
        });
    </script>
{% endblock %}
